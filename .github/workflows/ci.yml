name: CI

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master, "feat/*" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck \
            tcpdump \
            iproute2 \
            ethtool \
            jq \
            tshark \
            iptables \
            procps \
            wpasupplicant \
            python3-pip \
            python3-scapy \
            python3-jsonschema \
            python3-pytest \
            python3-pytest-cov
          pip3 install --break-system-packages ruff mypy 2>/dev/null || pip3 install ruff mypy

      - name: Run ShellCheck & Unprivileged Tests
        run: |
          make test

      - name: Run Privileged Namespace Integration Tests
        run: |
          sudo PYTHONDONTWRITEBYTECODE=1 tests/run_tests.sh

      - name: Verify Packaging & Installation Lifecycle
        run: |
          sudo make install
          make installcheck
          sudo make uninstall

      - name: Verify Clean Git Working Tree
        run: |
          git diff --exit-code

      - name: Normalize Artifact Permissions
        if: failure()
        run: |
          sudo chmod -R a+r /var/run/net-tap/ /tmp/net-tap-* /tmp/net_tap_* 2>/dev/null || true

      - name: Archive Test Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics-${{ matrix.os }}
          path: |
            /var/run/net-tap/
            /tmp/net-tap-*
            /tmp/net_tap_*
          if-no-files-found: ignore

  test-darwin:
    name: macOS Darwin Test Suite (macos-14)
    runs-on: macos-14
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install macOS Dependencies
        run: |
          brew install bash jq shellcheck
          python3 -m pip install --break-system-packages scapy jsonschema ruff mypy || python3 -m pip install scapy jsonschema ruff mypy

      - name: Run Linters & Static Analysis
        run: |
          shellcheck bin/net-tap.sh lib/*.sh tests/*.sh
          ruff check lib/ tests/
          mypy --ignore-missing-imports lib/probe.py

      - name: Run Python Mock & Unit Tests
        run: |
          python3 -B tests/test_probe_unit.py

      - name: Run Unprivileged Darwin Compliance Suite
        run: |
          BASH_BIN=$(command -v /opt/homebrew/bin/bash || command -v /usr/local/bin/bash || command -v bash)
          "$BASH_BIN" tests/run_tests.sh

      - name: Run Privileged Darwin Session Lifecycle
        run: |
          BASH_BIN=$(command -v /opt/homebrew/bin/bash || command -v /usr/local/bin/bash || command -v bash)
          sudo "$BASH_BIN" tests/run_tests.sh

      - name: Verify Clean Git Working Tree
        run: |
          git diff --exit-code
